<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fdfaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181316" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Bloom is a calm, private pregnancy companion: week-by-week guidance, reminders, meal plans and daily tracking. Your data never leaves your device." />
    <title>Bloom — Pregnancy Companion</title>
    <script>
      // Apply saved theme before first paint to avoid a flash.
      try {
        var raw = localStorage.getItem('bloom:profile');
        var pref = raw ? (JSON.parse(raw).state || {}).profile : null;
        var theme = pref && pref.theme ? pref.theme : 'system';
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
