name: iOS

on:
  push:
    branches: ["master", "claude/**"]
    paths:
      - "Folio/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "Folio/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 16
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Pick a simulator
        id: sim
        run: |
          xcrun simctl list devices available
          NAME=$(xcrun simctl list devices available iPhone | grep -oE 'iPhone [0-9]+( Pro| Pro Max| Plus)?' | sort -V | tail -1)
          echo "Simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Folio/Folio.xcodeproj \
            -scheme Folio \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            2>&1 | tee build.log

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Folio/Folio.xcodeproj \
            -scheme Folio \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            2>&1 | tee test.log

      - name: Summarize compiler errors
        if: failure()
        run: |
          echo "## Compiler / test errors" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -hE "error:|failed|Failing tests" build.log test.log 2>/dev/null | sort -u | head -200 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            build.log
            test.log
            TestResults.xcresult
          if-no-files-found: ignore
