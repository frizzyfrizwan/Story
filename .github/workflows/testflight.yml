name: TestFlight

# Archives Folio with automatic cloud signing and uploads it to TestFlight.
#
# One-time setup (repository Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID       10-character Apple Developer Team ID
#   ASC_KEY_ID          App Store Connect API key ID
#   ASC_ISSUER_ID       App Store Connect API issuer ID
#   ASC_API_KEY_P8      Full contents of the downloaded AuthKey_XXXX.p8 file
#
# The API key needs the App Manager (or Admin) role, and an app record with
# bundle id com.faisalrizwan.folio must exist in App Store Connect.

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - "Folio/**"
      - ".github/workflows/testflight.yml"

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive & upload
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_API_KEY_P8" ]; then
            echo "::warning::TestFlight secrets are not configured; skipping upload. See the comment at the top of this workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Select newest Xcode 16
        if: steps.secrets.outputs.ready == 'true'
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install App Store Connect API key
        if: steps.secrets.outputs.ready == 'true'
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          KEY_FILE=~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          RAW="$ASC_API_KEY_P8"

          # Accept a base64-encoded copy of the whole file as well as raw PEM.
          if ! printf '%s' "$RAW" | grep -q "BEGIN"; then
            DECODED=$(printf '%s' "$RAW" | tr -d '[:space:]' | base64 --decode 2>/dev/null || true)
            if printf '%s' "$DECODED" | grep -q "BEGIN PRIVATE KEY"; then
              RAW="$DECODED"
            fi
          fi

          # Rebuild the PEM with proper 64-column wrapping so a paste that lost
          # its line breaks still works.
          BODY=$(printf '%s' "$RAW" \
            | sed -e 's/-----BEGIN PRIVATE KEY-----//g' -e 's/-----END PRIVATE KEY-----//g' \
            | tr -d '[:space:]')
          {
            echo "-----BEGIN PRIVATE KEY-----"
            printf '%s' "$BODY" | fold -w 64
            echo
            echo "-----END PRIVATE KEY-----"
          } > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          echo "Key body length: ${#BODY} characters (a valid App Store Connect key is about 200)"
          if [ "${#BODY}" -lt 100 ] || ! openssl pkey -in "$KEY_FILE" -noout 2>/dev/null; then
            echo "::error::ASC_API_KEY_P8 is not a valid App Store Connect .p8 key. Open the downloaded AuthKey_${ASC_KEY_ID}.p8 in a plain-text editor, select all, and paste its entire contents (including the BEGIN/END lines) into the secret. If the file was never downloaded, revoke the key in App Store Connect and generate a new one."
            exit 1
          fi
          echo "API key looks valid."

      - name: Archive
        if: steps.secrets.outputs.ready == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Folio/Folio.xcodeproj \
            -scheme Folio \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Folio.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            2>&1 | tee archive.log | grep -E "error:|warning: .*signing|\*\* ARCHIVE" || true
          test -d build/Folio.xcarchive

      - name: Upload to TestFlight
        if: steps.secrets.outputs.ready == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Folio.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log | grep -E "error:|EXPORT|Upload" || true
          grep -q "EXPORT SUCCEEDED" export.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore
