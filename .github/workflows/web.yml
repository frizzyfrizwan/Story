name: Kestrel web

on:
  push:
    branches: ["master"]
    paths:
      - "kestrel/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "kestrel/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: kestrel

jobs:
  check:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: kestrel/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          AUTH_SECRET: ci-secret
          DATABASE_URL: file:./data/ci.db
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-build
          path: kestrel/.next/trace
          if-no-files-found: ignore
          retention-days: 3

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: kestrel/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
        env:
          AUTH_SECRET: e2e-secret
          DATABASE_URL: file:./data/e2e.db
          DEMO_MODE: "true"
      - run: pnpm test:e2e
        env:
          CI: "true"
          AUTH_SECRET: e2e-secret
          DATABASE_URL: file:./data/e2e.db
          DEMO_MODE: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: kestrel/playwright-report
          retention-days: 7
