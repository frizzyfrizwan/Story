[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenderdesk"
version = "0.1.0"
description = "TenderDesk — AI bid desk for small Canadian suppliers: match, qualify, and draft government tender responses."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tenderdesk = "tenderdesk.cli:main"

[tool.setuptools.packages.find]
include = ["tenderdesk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
